name: gh-pages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm install

      - name: Build Docs
        run: npm run doc

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs

